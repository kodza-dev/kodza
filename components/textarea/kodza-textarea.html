<div class="kodza-textarea" data-max="280">
  <label class="kodza-textarea__box">
    <textarea class="kodza-textarea__input" name="message" rows="2" placeholder=" " maxlength="280" required minlength="10" data-error="Ten characters at least. Bugs need context."></textarea>
    <span class="kodza-textarea__label">What broke?</span>
  </label>
  <p class="kodza-textarea__foot">
    <span class="kodza-textarea__note"><span class="kodza-textarea__hint">Steps to reproduce are a love language.</span><span class="kodza-textarea__error" aria-live="polite"></span></span>
    <span class="kodza-textarea__count" aria-hidden="true"><svg viewBox="0 0 20 20"><circle class="kodza-textarea__ring-track" cx="10" cy="10" r="8"/><circle class="kodza-textarea__ring" cx="10" cy="10" r="8" pathLength="1"/></svg><span class="kodza-textarea__left"></span></span>
  </p>
</div>

<div class="kodza-textarea">
  <label class="kodza-textarea__box">
    <textarea class="kodza-textarea__input" name="notes" rows="2" placeholder=" " disabled>Release notes are locked until Friday. Not on our watch.</textarea>
    <span class="kodza-textarea__label">Release notes</span>
  </label>
</div>
