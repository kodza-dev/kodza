<div class="kodza-upload" data-max-mb="10">
  <label class="kodza-upload__zone">
    <input class="kodza-upload__input" type="file" name="files" multiple accept="image/*,.pdf,.zip">
    <svg class="kodza-upload__border" aria-hidden="true"><rect rx="16" ry="16"/></svg>
    <span class="kodza-upload__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path class="kodza-upload__arrow" d="M12 15V4M7.5 8.5 12 4l4.5 4.5"/><path d="M4 14v3.5A2.5 2.5 0 0 0 6.5 20h11a2.5 2.5 0 0 0 2.5-2.5V14"/></svg></span>
    <span class="kodza-upload__title"><span class="kodza-upload__words"><span>Drop files here, or <u>browse</u></span></span></span>
    <span class="kodza-upload__hint">Images, PDFs and ZIPs. 10 MB each, which is plenty.</span>
  </label>
  <ul class="kodza-upload__list" aria-live="polite"></ul>
</div>
