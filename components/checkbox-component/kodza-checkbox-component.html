<fieldset class="kodza-checkbox">
  <legend class="kodza-checkbox__legend">Email me about</legend>
  <label class="kodza-checkbox__item kodza-checkbox__item--all">
    <input class="kodza-checkbox__input" type="checkbox" data-all>
    <span class="kodza-checkbox__box" aria-hidden="true"><svg viewBox="0 0 16 16"><path class="kodza-checkbox__tick" d="M3.5 8.5l3 3 6-7" pathLength="1"/><path class="kodza-checkbox__dash" d="M4 8h8" pathLength="1"/></svg></span>
    <span class="kodza-checkbox__text">Everything</span>
  </label>
  <label class="kodza-checkbox__item">
    <input class="kodza-checkbox__input" type="checkbox" name="topics" value="components" checked>
    <span class="kodza-checkbox__box" aria-hidden="true"><svg viewBox="0 0 16 16"><path class="kodza-checkbox__tick" d="M3.5 8.5l3 3 6-7" pathLength="1"/><path class="kodza-checkbox__dash" d="M4 8h8" pathLength="1"/></svg></span>
    <span class="kodza-checkbox__text">New components<small>Every Tuesday, give or take a deploy.</small></span>
  </label>
  <label class="kodza-checkbox__item">
    <input class="kodza-checkbox__input" type="checkbox" name="topics" value="changelog">
    <span class="kodza-checkbox__box" aria-hidden="true"><svg viewBox="0 0 16 16"><path class="kodza-checkbox__tick" d="M3.5 8.5l3 3 6-7" pathLength="1"/><path class="kodza-checkbox__dash" d="M4 8h8" pathLength="1"/></svg></span>
    <span class="kodza-checkbox__text">The changelog<small>What broke, what we fixed, who to blame.</small></span>
  </label>
  <label class="kodza-checkbox__item">
    <input class="kodza-checkbox__input" type="checkbox" name="topics" value="memes" disabled>
    <span class="kodza-checkbox__box" aria-hidden="true"><svg viewBox="0 0 16 16"><path class="kodza-checkbox__tick" d="M3.5 8.5l3 3 6-7" pathLength="1"/><path class="kodza-checkbox__dash" d="M4 8h8" pathLength="1"/></svg></span>
    <span class="kodza-checkbox__text">Memes<small>Not available in your region. Or any region.</small></span>
  </label>
</fieldset>

<fieldset class="kodza-checkbox kodza-checkbox--cards">
  <legend class="kodza-checkbox__legend">Your stack</legend>
  <label class="kodza-checkbox__item">
    <input class="kodza-checkbox__input" type="checkbox" name="stack" value="html" checked>
    <span class="kodza-checkbox__box" aria-hidden="true"><svg viewBox="0 0 16 16"><path class="kodza-checkbox__tick" d="M3.5 8.5l3 3 6-7" pathLength="1"/><path class="kodza-checkbox__dash" d="M4 8h8" pathLength="1"/></svg></span>
    <span class="kodza-checkbox__text">HTML<small>The classic.</small></span>
  </label>
  <label class="kodza-checkbox__item">
    <input class="kodza-checkbox__input" type="checkbox" name="stack" value="css">
    <span class="kodza-checkbox__box" aria-hidden="true"><svg viewBox="0 0 16 16"><path class="kodza-checkbox__tick" d="M3.5 8.5l3 3 6-7" pathLength="1"/><path class="kodza-checkbox__dash" d="M4 8h8" pathLength="1"/></svg></span>
    <span class="kodza-checkbox__text">CSS<small>Cascading on purpose.</small></span>
  </label>
  <label class="kodza-checkbox__item">
    <input class="kodza-checkbox__input" type="checkbox" name="stack" value="js">
    <span class="kodza-checkbox__box" aria-hidden="true"><svg viewBox="0 0 16 16"><path class="kodza-checkbox__tick" d="M3.5 8.5l3 3 6-7" pathLength="1"/><path class="kodza-checkbox__dash" d="M4 8h8" pathLength="1"/></svg></span>
    <span class="kodza-checkbox__text">Vanilla JS<small>No flavour added.</small></span>
  </label>
</fieldset>
