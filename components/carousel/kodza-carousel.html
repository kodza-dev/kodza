<section class="kodza-carousel kodza-carousel--quotes" aria-roledescription="carousel" aria-label="What developers say">

        <blockquote class="kodza-carousel__says">Finally a carousel that doesn’t hijack my scroll wheel. I scrolled past it just to feel something.</blockquote>

      </figure>
    </div>
    <div class="kodza-carousel__slide" role="group" aria-roledescription="slide">
      <figure class="kodza-carousel__quote">
        <blockquote class="kodza-carousel__says">No npm install. No peer dependency drama. I pasted it into WordPress and went to lunch.</blockquote>
        <figcaption><span class="kodza-carousel__avatar" aria-hidden="true">TB</span><span class="kodza-carousel__who"><b>Theo B.</b> WordPress, since 4.9</span></figcaption>
      </figure>
    </div>
    <div class="kodza-carousel__slide" role="group" aria-roledescription="slide">
      <figure class="kodza-carousel__quote">
