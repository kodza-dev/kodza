<div class="kodza-phone" data-country="FR">
  <label class="kodza-phone__box">
    <span class="kodza-phone__label">Mobile</span>
    <input class="kodza-phone__native" type="tel" name="mobile" autocomplete="tel" required>
  </label>
  <p class="kodza-phone__note">
    <span class="kodza-phone__hint">We text one code. Not a newsletter.</span>
    <span class="kodza-phone__error" aria-live="polite"></span>
  </p>
</div>

<div class="kodza-phone" data-country="GB" data-countries="GB,IE,FR,BE,NL,DE,ES,IT,PT">
  <label class="kodza-phone__box">
    <span class="kodza-phone__label">Courier contact</span>
    <input class="kodza-phone__native" type="tel" name="courier" autocomplete="tel" value="+44 7700 900123">
  </label>
  <p class="kodza-phone__note">
    <span class="kodza-phone__hint">Only the courier sees it.</span>
    <span class="kodza-phone__error" aria-live="polite"></span>
  </p>
</div>

<div class="kodza-phone" data-countries="US">
  <label class="kodza-phone__box">
    <span class="kodza-phone__label">Mobile, US only</span>
    <input class="kodza-phone__native" type="tel" name="us-mobile" autocomplete="tel">
  </label>
  <p class="kodza-phone__note">
    <span class="kodza-phone__hint">US numbers only. For now.</span>
    <span class="kodza-phone__error" aria-live="polite"></span>
  </p>
</div>
