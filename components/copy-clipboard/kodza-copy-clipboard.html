<div class="kodza-copy" data-kodza-copy>
  <code class="kodza-copy__code">git commit -m "works on my machine"</code>
  <button class="kodza-copy__button" type="button">
    <span class="kodza-copy__icon" aria-hidden="true">
      <svg class="kodza-copy__glyph kodza-copy__glyph--copy" viewBox="0 0 16 16"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5" /><path d="M10.5 3.5v-.5a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h.5" /></svg>
      <svg class="kodza-copy__glyph kodza-copy__glyph--done" viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5" pathLength="1" /></svg>
    </span>
    <span class="kodza-copy__label">
      <span class="kodza-copy__word">Copy</span>
      <span class="kodza-copy__word kodza-copy__word--done" aria-hidden="true">Copied</span>
    </span>
  </button>
  <span class="kodza-copy__status" role="status"></span>
</div>

      <svg class="kodza-copy__glyph kodza-copy__glyph--done" viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5" pathLength="1" /></svg>
    </span>
    <span class="kodza-copy__label">
      <span class="kodza-copy__word">Copy</span>
      <span class="kodza-copy__word kodza-copy__word--done" aria-hidden="true">Copied</span>
    </span>
  </button>
  <span class="kodza-copy__status" role="status"></span>
</div>
