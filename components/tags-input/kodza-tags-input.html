<div class="kodza-tags" data-max="6">
  <label class="kodza-tags__box">
    <span class="kodza-tags__label">Keywords</span>
    <input class="kodza-tags__native" type="text" name="keywords" value="css, no build step" autocomplete="off">
  </label>
  <p class="kodza-tags__note">
    <span class="kodza-tags__hint">Enter or a comma. No dupes.</span>
    <span class="kodza-tags__error" aria-live="polite"></span>
  </p>
</div>

<div class="kodza-tags">
  <label class="kodza-tags__box">
    <span class="kodza-tags__label">Invite your team</span>
    <input class="kodza-tags__native" type="email" name="invite" value="amara@studio.dev" multiple autocomplete="off">
  </label>
  <p class="kodza-tags__note">
    <span class="kodza-tags__hint">Paste the whole list. We split it.</span>
    <span class="kodza-tags__error" aria-live="polite"></span>
  </p>
</div>
