<div class="kodza-dropdown">
  <button class="kodza-dropdown__trigger" type="button" aria-haspopup="menu" aria-expanded="false">
    Options
    <svg class="kodza-dropdown__chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6.5 8 10.5l4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="kodza-dropdown__menu" role="menu" aria-label="Options">
    <button class="kodza-dropdown__item" type="button" role="menuitem">Copy code <kbd class="kodza-dropdown__hint">⌘C</kbd></button>
    <button class="kodza-dropdown__item" type="button" role="menuitem">Download ZIP</button>
    <button class="kodza-dropdown__item" type="button" role="menuitem">Open in a new tab</button>
    <div class="kodza-dropdown__separator" role="separator"></div>
    <button class="kodza-dropdown__item" type="button" role="menuitem" aria-disabled="true">Deploy on a Friday <span class="kodza-dropdown__hint">Nope</span></button>
  </div>
</div>

<div class="kodza-dropdown">
  <button class="kodza-dropdown__trigger" type="button" aria-haspopup="menu" aria-expanded="false">
    Sort: <span class="kodza-dropdown__value">Newest</span>
    <svg class="kodza-dropdown__chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6.5 8 10.5l4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="kodza-dropdown__menu" role="menu" aria-label="Sort by">
    <p class="kodza-dropdown__label" role="presentation">Sort by</p>
    <button class="kodza-dropdown__item" type="button" role="menuitemradio" aria-checked="true">Newest</button>
    <button class="kodza-dropdown__item" type="button" role="menuitemradio" aria-checked="false">Oldest</button>
    <button class="kodza-dropdown__item" type="button" role="menuitemradio" aria-checked="false">Most copied</button>
    <button class="kodza-dropdown__item" type="button" role="menuitemradio" aria-checked="false">Least broken</button>
  </div>
</div>
