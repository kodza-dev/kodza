<fieldset class="kodza-choice-cards">
  <legend class="kodza-choice-cards__legend">How should it get to you?</legend>
  <div class="kodza-choice-cards__list">
    <label class="kodza-choice-cards__card">
      <input class="kodza-choice-cards__input" type="radio" name="delivery" value="standard" checked>
      <span class="kodza-choice-cards__mark" aria-hidden="true"><svg class="kodza-choice-cards__svg" viewBox="0 0 20 20" width="20" height="20"><path class="kodza-choice-cards__check" d="M6 10.4l2.6 2.6L14 7.4" pathLength="1"/></svg></span>
      <span class="kodza-choice-cards__title">Standard</span>
      <span class="kodza-choice-cards__text">3 to 5 working days. Tracked, no surprises.</span>
      <span class="kodza-choice-cards__price">Free</span>
    </label>
    <label class="kodza-choice-cards__card">
      <input class="kodza-choice-cards__input" type="radio" name="delivery" value="express">
      <span class="kodza-choice-cards__mark" aria-hidden="true"><svg class="kodza-choice-cards__svg" viewBox="0 0 20 20" width="20" height="20"><path class="kodza-choice-cards__check" d="M6 10.4l2.6 2.6L14 7.4" pathLength="1"/></svg></span>
      <span class="kodza-choice-cards__title">Express</span>
      <span class="kodza-choice-cards__text">Tomorrow before noon if you order by 6 pm.</span>
      <span class="kodza-choice-cards__price">€9</span>
    </label>
    <label class="kodza-choice-cards__card">
      <input class="kodza-choice-cards__input" type="radio" name="delivery" value="pickup">
      <span class="kodza-choice-cards__mark" aria-hidden="true"><svg class="kodza-choice-cards__svg" viewBox="0 0 20 20" width="20" height="20"><path class="kodza-choice-cards__check" d="M6 10.4l2.6 2.6L14 7.4" pathLength="1"/></svg></span>
      <span class="kodza-choice-cards__title">Pickup</span>
      <span class="kodza-choice-cards__text">Nantes, quai de la Fosse. Bring the code.</span>
      <span class="kodza-choice-cards__price">Free</span>
    </label>
  </div>
</fieldset>

<fieldset class="kodza-choice-cards">
  <legend class="kodza-choice-cards__legend">What brings you here? Pick all that apply.</legend>
  <div class="kodza-choice-cards__list">
    <label class="kodza-choice-cards__card">
      <input class="kodza-choice-cards__input" type="checkbox" name="goal" value="launch">
      <span class="kodza-choice-cards__mark" aria-hidden="true"><svg class="kodza-choice-cards__svg" viewBox="0 0 20 20" width="20" height="20"><path class="kodza-choice-cards__check" d="M6 10.4l2.6 2.6L14 7.4" pathLength="1"/></svg></span>
      <span class="kodza-choice-cards__title">A launch this week</span>
      <span class="kodza-choice-cards__text">Landing page, waitlist, the usual panic.</span>
    </label>
    <label class="kodza-choice-cards__card">
      <input class="kodza-choice-cards__input" type="checkbox" name="goal" value="client" checked>
      <span class="kodza-choice-cards__mark" aria-hidden="true"><svg class="kodza-choice-cards__svg" viewBox="0 0 20 20" width="20" height="20"><path class="kodza-choice-cards__check" d="M6 10.4l2.6 2.6L14 7.4" pathLength="1"/></svg></span>
      <span class="kodza-choice-cards__title">A client site</span>
      <span class="kodza-choice-cards__text">WordPress, and a theme you did not pick.</span>
    </label>
    <label class="kodza-choice-cards__card">
      <input class="kodza-choice-cards__input" type="checkbox" name="goal" value="looking">
      <span class="kodza-choice-cards__mark" aria-hidden="true"><svg class="kodza-choice-cards__svg" viewBox="0 0 20 20" width="20" height="20"><path class="kodza-choice-cards__check" d="M6 10.4l2.6 2.6L14 7.4" pathLength="1"/></svg></span>
      <span class="kodza-choice-cards__title">Just looking</span>
      <span class="kodza-choice-cards__text">Fair. Copy something anyway.</span>
    </label>
  </div>
</fieldset>
