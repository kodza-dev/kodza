<section class="kodza-interactive-dots" data-kodza-interactive-dots>

        <p class="kodza-interactive-dots__actions">
          <a class="kodza-interactive-dots__button" href="#">Start shipping</a>
          <a class="kodza-interactive-dots__button kodza-interactive-dots__button--ghost" href="#">Read the docs</a>

      </div>
    </div>
  </div>
