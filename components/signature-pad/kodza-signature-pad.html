<div class="kodza-signature">
  <div class="kodza-signature__pad">
    <label class="kodza-signature__write">
      <span class="kodza-signature__label">Signature, quote #2048</span>
      <input class="kodza-signature__type" type="text" name="signed-by" autocomplete="name" spellcheck="false" required>
      <span class="kodza-signature__prompt" aria-hidden="true"><span class="kodza-signature__say">Sign here</span></span>
    </label>
    <div class="kodza-signature__tools">
      <button class="kodza-signature__undo" type="button">Undo</button>
      <button class="kodza-signature__clear" type="button">Clear</button>
    </div>
  </div>
  <input class="kodza-signature__value" type="hidden" name="signature">
  <p class="kodza-signature__note">
    <span class="kodza-signature__hint">Finger, mouse or stylus. Keyboard? Type your name.</span>
    <span class="kodza-signature__error" aria-live="polite"></span>
  </p>
</div>
