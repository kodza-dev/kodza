<div class="kodza-combobox">
  <label class="kodza-combobox__box">
    <span class="kodza-combobox__label">Time zone</span>
    <select class="kodza-combobox__native" name="timezone">
      <optgroup label="Europe">
        <option value="Europe/London" data-meta="UTC+0">London</option>
        <option value="Europe/Lisbon" data-meta="UTC+0">Lisbon</option>
        <option value="Europe/Paris" data-meta="UTC+1" selected>Paris</option>
        <option value="Europe/Berlin" data-meta="UTC+1">Berlin</option>
        <option value="Europe/Madrid" data-meta="UTC+1">Madrid</option>
        <option value="Europe/Stockholm" data-meta="UTC+1">Stockholm</option>
        <option value="Europe/Athens" data-meta="UTC+2">Athens</option>
        <option value="Europe/Helsinki" data-meta="UTC+2">Helsinki</option>
        <option value="Europe/Istanbul" data-meta="UTC+3">Istanbul</option>
      </optgroup>
      <optgroup label="Africa">
        <option value="Africa/Dakar" data-meta="UTC+0">Dakar</option>
        <option value="Africa/Lagos" data-meta="UTC+1">Lagos</option>
        <option value="Africa/Cairo" data-meta="UTC+2">Cairo</option>
        <option value="Africa/Johannesburg" data-meta="UTC+2">Johannesburg</option>
        <option value="Africa/Nairobi" data-meta="UTC+3">Nairobi</option>
      </optgroup>
      <optgroup label="Americas">
        <option value="America/Anchorage" data-meta="UTC−9">Anchorage</option>
        <option value="America/Los_Angeles" data-meta="UTC−8">Los Angeles</option>
        <option value="America/Denver" data-meta="UTC−7">Denver</option>
        <option value="America/Mexico_City" data-meta="UTC−6">Mexico City</option>
        <option value="America/Chicago" data-meta="UTC−6">Chicago</option>
        <option value="America/New_York" data-meta="UTC−5">New York</option>
        <option value="America/Bogota" data-meta="UTC−5">Bogotá</option>
        <option value="America/Halifax" data-meta="UTC−4">Halifax</option>
        <option value="America/Santiago" data-meta="UTC−3">Santiago</option>
        <option value="America/Sao_Paulo" data-meta="UTC−3">São Paulo</option>
        <option value="America/Argentina/Buenos_Aires" data-meta="UTC−3">Buenos Aires</option>
      </optgroup>
      <optgroup label="Asia">
        <option value="Asia/Dubai" data-meta="UTC+4">Dubai</option>
        <option value="Asia/Karachi" data-meta="UTC+5">Karachi</option>
        <option value="Asia/Kolkata" data-meta="UTC+5:30">Mumbai</option>
        <option value="Asia/Kathmandu" data-meta="UTC+5:45">Kathmandu</option>
        <option value="Asia/Dhaka" data-meta="UTC+6">Dhaka</option>
        <option value="Asia/Bangkok" data-meta="UTC+7">Bangkok</option>
        <option value="Asia/Singapore" data-meta="UTC+8">Singapore</option>
        <option value="Asia/Shanghai" data-meta="UTC+8">Shanghai</option>
        <option value="Asia/Seoul" data-meta="UTC+9">Seoul</option>
        <option value="Asia/Tokyo" data-meta="UTC+9">Tokyo</option>
      </optgroup>
      <optgroup label="Pacific">
        <option value="Pacific/Honolulu" data-meta="UTC−10">Honolulu</option>
        <option value="Australia/Perth" data-meta="UTC+8">Perth</option>
        <option value="Australia/Sydney" data-meta="UTC+11">Sydney</option>
        <option value="Pacific/Fiji" data-meta="UTC+12">Fiji</option>
        <option value="Pacific/Auckland" data-meta="UTC+13">Auckland</option>
      </optgroup>
    </select>
  </label>
  <p class="kodza-combobox__note">
    <span class="kodza-combobox__hint">City or offset: “+9” works.</span>
    <span class="kodza-combobox__error" aria-live="polite"></span>
  </p>
</div>

<div class="kodza-combobox">
