<div class="kodza-split" role="group" aria-label="Merge">
  <button class="kodza-split__main" type="button" value="merge"><span class="kodza-split__label">Merge pull request</span></button>
  <button class="kodza-split__toggle" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="More ways to merge">
    <svg class="kodza-split__chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6.5 8 10.5l4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="kodza-split__menu" role="menu" aria-label="Ways to merge">
    <button class="kodza-split__item" type="button" role="menuitemradio" aria-checked="true" value="merge">Merge pull request <span class="kodza-split__hint">every commit</span></button>
    <button class="kodza-split__item" type="button" role="menuitemradio" aria-checked="false" value="squash">Squash &amp; merge <span class="kodza-split__hint">one tidy commit</span></button>
    <button class="kodza-split__item" type="button" role="menuitemradio" aria-checked="false" value="rebase">Rebase <span class="kodza-split__hint">history, rewritten</span></button>
  </div>
</div>

<div class="kodza-split kodza-split--outline" role="group" aria-label="Save">
  <button class="kodza-split__main" type="button"><span class="kodza-split__label">Save draft</span></button>
  <button class="kodza-split__toggle" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="More save options">
    <svg class="kodza-split__chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6.5 8 10.5l4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="kodza-split__menu" role="menu" aria-label="Save options">
    <button class="kodza-split__item" type="button" role="menuitem">Save and publish <kbd class="kodza-split__hint">⌘↵</kbd></button>
    <button class="kodza-split__item" type="button" role="menuitem">Save as template</button>
    <button class="kodza-split__item" type="button" role="menuitem">Schedule for Monday</button>
    <div class="kodza-split__separator" role="separator"></div>
    <button class="kodza-split__item" type="button" role="menuitem" aria-disabled="true">Publish on a Friday <span class="kodza-split__hint">Nope</span></button>
  </div>
</div>
