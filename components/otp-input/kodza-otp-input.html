<div class="kodza-otp" data-length="6">
  <p class="kodza-otp__label">Enter the code we sent to you@example.com</p>
  <div class="kodza-otp__field">
    <input class="kodza-otp__input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" aria-label="Six-digit code">
    <div class="kodza-otp__cells" aria-hidden="true"></div>
  </div>
  <p class="kodza-otp__foot">
    <span class="kodza-otp__done" aria-live="polite"></span>
    <span class="kodza-otp__again">Didn't get it? <button class="kodza-otp__resend" type="button">Resend in <span class="kodza-otp__count">30</span>s</button></span>
  </p>
</div>
