<p class="kodza-scroll-reveal">Most animation libraries ship forty kilobytes of just in case. This one is a paragraph and a few lines of JavaScript.</p>

<p class="kodza-scroll-reveal" data-reveal="blur">Every word starts out of focus and sharpens into place, as if the page was waking up.</p>

<p class="kodza-scroll-reveal" data-reveal="rise">Or let the words climb into line, one by one, at the exact speed you scroll.</p>
