<div class="kodza-share">
  <button class="kodza-share__toggle" type="button" aria-expanded="false">
    <svg class="kodza-share__glyph" viewBox="0 0 24 24" aria-hidden="true">
      <path class="kodza-share__tray" d="M5 11.5V18a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6.5" pathLength="1" />
      <path class="kodza-share__arrow" d="M12 14.5V3.8M7.8 8 12 3.8 16.2 8" />
      <path class="kodza-share__cross" d="M6.8 6.8l10.4 10.4" pathLength="1" />
      <path class="kodza-share__cross" d="M17.2 6.8 6.8 17.2" pathLength="1" />
    </svg>
    <span class="kodza-share__label"><span>Share</span></span>
  </button>
  <div class="kodza-share__options" role="group" aria-label="Share this page">
    <button class="kodza-share__option" type="button" data-share="copy" aria-label="Copy link">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <g class="kodza-share__link"><path d="M9.6 14.4l4.8-4.8" /><path d="M11.2 6.6l1.3-1.3a4 4 0 0 1 5.7 5.7l-1.3 1.3" /><path d="M12.8 17.4l-1.3 1.3a4 4 0 0 1-5.7-5.7l1.3-1.3" /></g>
        <path class="kodza-share__check" d="M5.5 12.5l4.2 4.2 8.8-9.2" pathLength="1" />
      </svg>
    </button>
    <a class="kodza-share__option" data-share="x" href="https://x.com/intent/post?url={url}&amp;text={title}" target="_blank" rel="noopener" aria-label="Post on X">
      <svg class="kodza-share__brand" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.7 3h3l-6.6 7.6L22 21h-6.1l-4.8-6.3L5.6 21h-3l7.1-8.1L2.2 3h6.2l4.4 5.8L17.7 3Zm-1 16.2h1.7L7.4 4.7H5.6l11.1 14.5Z" /></svg>
    </a>
    <a class="kodza-share__option" data-share="linkedin" href="https://www.linkedin.com/sharing/share-offsite/?url={url}" target="_blank" rel="noopener" aria-label="Share on LinkedIn">
      <svg class="kodza-share__brand" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="5.2" r="2.2" /><path d="M3.2 9h3.6v11.5H3.2zM9.4 9h3.45v1.6c.55-1 1.9-1.95 3.85-1.95 3.65 0 4.3 2.4 4.3 5.5v6.35h-3.6v-5.6c0-1.35-.05-3.05-1.85-3.05-1.85 0-2.55 1.4-2.55 2.95v5.7H9.4z" /></svg>
    </a>
    <a class="kodza-share__option" data-share="email" href="mailto:?subject={title}&amp;body={url}" aria-label="Send by email">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="2.5" /><path d="M4.5 7.5l7.5 5.5 7.5-5.5" /></svg>
    </a>
  </div>
  <span class="kodza-share__status" role="status"></span>
</div>
