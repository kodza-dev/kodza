<div class="kodza-inline-edit kodza-inline-edit--title">
  <input class="kodza-inline-edit__native" type="text" name="project" value="Shoreline redesign" aria-label="Project name" required maxlength="60" autocomplete="off">
</div>

<div class="kodza-inline-edit">
  <span class="kodza-inline-edit__label">Brief</span>
  <textarea class="kodza-inline-edit__native" name="brief" rows="1" placeholder="Add a brief. One line beats a meeting.">Ship the landing page by Friday. Nothing else moves until it's live.</textarea>
</div>

<div class="kodza-inline-edit">
  <span class="kodza-inline-edit__label">Address</span>
  <span class="kodza-inline-edit__prefix">kodza.dev/</span>
  <input class="kodza-inline-edit__native" type="text" name="handle" value="le-havre-studio" required pattern="[a-z0-9\-]+" spellcheck="false" autocomplete="off" data-error="Lowercase letters, digits and dashes only.">
  <p class="kodza-inline-edit__note">
    <span class="kodza-inline-edit__hint">Old links keep working.</span>
    <span class="kodza-inline-edit__error" aria-live="polite"></span>
  </p>
</div>
