<div class="kodza-masonry-grid" data-show="9" data-batch="4">

        <figcaption class="kodza-masonry-grid__caption"><span class="kodza-masonry-grid__title">border-radius: 50% 50% 0 0</span><span class="kodza-masonry-grid__meta">Soft on top</span></figcaption>

    <li class="kodza-masonry-grid__item">

        <figcaption class="kodza-masonry-grid__caption"><span class="kodza-masonry-grid__title">display: block</span><span class="kodza-masonry-grid__meta">Takes the whole line</span></figcaption>

      </figure>
    </li>
    <li class="kodza-masonry-grid__item">
      <figure class="kodza-masonry-grid__figure">
        <span class="kodza-masonry-grid__frame"><img class="kodza-masonry-grid__img" src="https://kodza.dev/media/kz-stack-1400.webp" width="1400" height="1050" alt="Concrete slabs stacked one on another" loading="lazy" decoding="async"></span>
        <figcaption class="kodza-masonry-grid__caption"><span class="kodza-masonry-grid__title">z-index: 3</span><span class="kodza-masonry-grid__meta">Not 9999</span></figcaption>

      <figure class="kodza-masonry-grid__figure">

      <figure class="kodza-masonry-grid__figure">

      <figure class="kodza-masonry-grid__figure">

    </li>
    <li class="kodza-masonry-grid__item">
      <figure class="kodza-masonry-grid__figure">

      </figure>

    <li class="kodza-masonry-grid__item">
      <figure class="kodza-masonry-grid__figure">

    <li class="kodza-masonry-grid__item">
      <figure class="kodza-masonry-grid__figure">
