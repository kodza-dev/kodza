<fieldset class="kodza-rating-scale">
  <legend class="kodza-rating-scale__legend">How likely are you to recommend Kodza to another dev?</legend>
  <div class="kodza-rating-scale__scale">
    <label class="kodza-rating-scale__option" data-end="low">
      <input class="kodza-rating-scale__input" type="radio" name="recommend" value="0">
      <span class="kodza-rating-scale__value">0<span class="kodza-rating-scale__sr"> (not likely)</span></span>
      <span class="kodza-rating-scale__ink" aria-hidden="true">0</span>
    </label>
    <label class="kodza-rating-scale__option" data-end="low">
      <input class="kodza-rating-scale__input" type="radio" name="recommend" value="1">
      <span class="kodza-rating-scale__value">1</span>
      <span class="kodza-rating-scale__ink" aria-hidden="true">1</span>
    </label>
    <label class="kodza-rating-scale__option" data-end="low">
      <input class="kodza-rating-scale__input" type="radio" name="recommend" value="2">
      <span class="kodza-rating-scale__value">2</span>
      <span class="kodza-rating-scale__ink" aria-hidden="true">2</span>
    </label>
    <label class="kodza-rating-scale__option" data-end="low">
      <input class="kodza-rating-scale__input" type="radio" name="recommend" value="3">
      <span class="kodza-rating-scale__value">3</span>
      <span class="kodza-rating-scale__ink" aria-hidden="true">3</span>
    </label>
    <label class="kodza-rating-scale__option">
      <input class="kodza-rating-scale__input" type="radio" name="recommend" value="4">
      <span class="kodza-rating-scale__value">4</span>
      <span class="kodza-rating-scale__ink" aria-hidden="true">4</span>
    </label>
    <label class="kodza-rating-scale__option">
      <input class="kodza-rating-scale__input" type="radio" name="recommend" value="5">
      <span class="kodza-rating-scale__value">5</span>
      <span class="kodza-rating-scale__ink" aria-hidden="true">5</span>
    </label>
    <label class="kodza-rating-scale__option">
      <input class="kodza-rating-scale__input" type="radio" name="recommend" value="6">
      <span class="kodza-rating-scale__value">6</span>
      <span class="kodza-rating-scale__ink" aria-hidden="true">6</span>
    </label>
    <label class="kodza-rating-scale__option">
      <input class="kodza-rating-scale__input" type="radio" name="recommend" value="7">
      <span class="kodza-rating-scale__value">7</span>
      <span class="kodza-rating-scale__ink" aria-hidden="true">7</span>
    </label>
    <label class="kodza-rating-scale__option" data-end="high">
      <input class="kodza-rating-scale__input" type="radio" name="recommend" value="8">
      <span class="kodza-rating-scale__value">8</span>
      <span class="kodza-rating-scale__ink" aria-hidden="true">8</span>
    </label>
    <label class="kodza-rating-scale__option" data-end="high">
      <input class="kodza-rating-scale__input" type="radio" name="recommend" value="9">
      <span class="kodza-rating-scale__value">9</span>
      <span class="kodza-rating-scale__ink" aria-hidden="true">9</span>
    </label>
    <label class="kodza-rating-scale__option" data-end="high">
      <input class="kodza-rating-scale__input" type="radio" name="recommend" value="10">
      <span class="kodza-rating-scale__value">10<span class="kodza-rating-scale__sr"> (ship it to everyone)</span></span>
      <span class="kodza-rating-scale__ink" aria-hidden="true">10</span>
    </label>
  </div>
  <div class="kodza-rating-scale__ends" aria-hidden="true">
    <span class="kodza-rating-scale__end kodza-rating-scale__end--low">Not likely</span>
    <span class="kodza-rating-scale__end kodza-rating-scale__end--high">Ship it to everyone</span>
  </div>
  <div class="kodza-rating-scale__follow">
    <div class="kodza-rating-scale__follow-inner">
      <label class="kodza-rating-scale__box">
        <span class="kodza-rating-scale__ask">
          <span class="kodza-rating-scale__question kodza-rating-scale__question--low">What broke? Be blunt.</span>
          <span class="kodza-rating-scale__question kodza-rating-scale__question--mid">What would make it a 10?</span>
          <span class="kodza-rating-scale__question kodza-rating-scale__question--high">Nice. What sold you?</span>
        </span>
        <textarea class="kodza-rating-scale__text" name="recommend-why" rows="2"></textarea>
      </label>
    </div>
  </div>
</fieldset>

<fieldset class="kodza-rating-scale kodza-rating-scale--fill">
  <legend class="kodza-rating-scale__legend">How painful was the setup?</legend>
  <div class="kodza-rating-scale__scale">
    <label class="kodza-rating-scale__option" data-end="low">
      <input class="kodza-rating-scale__input" type="radio" name="setup-pain" value="1">
      <span class="kodza-rating-scale__value">1<span class="kodza-rating-scale__sr"> (barely noticed)</span></span>
      <span class="kodza-rating-scale__ink" aria-hidden="true">1</span>
    </label>
    <label class="kodza-rating-scale__option" data-end="low">
      <input class="kodza-rating-scale__input" type="radio" name="setup-pain" value="2" checked>
      <span class="kodza-rating-scale__value">2</span>
      <span class="kodza-rating-scale__ink" aria-hidden="true">2</span>
    </label>
    <label class="kodza-rating-scale__option">
      <input class="kodza-rating-scale__input" type="radio" name="setup-pain" value="3">
      <span class="kodza-rating-scale__value">3</span>
      <span class="kodza-rating-scale__ink" aria-hidden="true">3</span>
    </label>
    <label class="kodza-rating-scale__option" data-end="high">
      <input class="kodza-rating-scale__input" type="radio" name="setup-pain" value="4">
      <span class="kodza-rating-scale__value">4</span>
      <span class="kodza-rating-scale__ink" aria-hidden="true">4</span>
    </label>
    <label class="kodza-rating-scale__option" data-end="high">
      <input class="kodza-rating-scale__input" type="radio" name="setup-pain" value="5">
      <span class="kodza-rating-scale__value">5<span class="kodza-rating-scale__sr"> (send help)</span></span>
      <span class="kodza-rating-scale__ink" aria-hidden="true">5</span>
    </label>
  </div>
  <div class="kodza-rating-scale__ends" aria-hidden="true">
    <span class="kodza-rating-scale__end kodza-rating-scale__end--low">Barely noticed</span>
    <span class="kodza-rating-scale__end kodza-rating-scale__end--high">Send help</span>
  </div>
</fieldset>
