<div class="kodza-toast">
  <div class="kodza-toast__triggers">
    <button class="kodza-toast__trigger" type="button" data-toast="Copied. Paste responsibly." data-type="success">Copy code</button>
    <button class="kodza-toast__trigger" type="button" data-toast="Deploying to production…" data-type="loading" data-then="Deployed. On a Tuesday, like adults.">Deploy</button>
    <button class="kodza-toast__trigger" type="button" data-toast="Component moved to the trash." data-action="Undo">Delete</button>
    <button class="kodza-toast__trigger" type="button" data-toast="Build failed: 1 error, 0 regrets." data-type="error">Break the build</button>
  </div>
  <ol class="kodza-toast__stack" aria-label="Notifications"></ol>
</div>
