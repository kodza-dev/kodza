<div class="kodza-cart-drawer" data-free-shipping="15000" data-currency="EUR">
  <button class="kodza-cart-drawer__trigger" type="button" aria-label="Bag, empty">
    <svg class="kodza-cart-drawer__bag" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M5.2 8.2h13.6l-1 11a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z" />
      <path d="M9 8.2V6.8a3 3 0 0 1 6 0v1.4" />
    </svg>
    <span class="kodza-cart-drawer__label">Bag</span>
    <span class="kodza-cart-drawer__badge kodza-cart-drawer__roll" aria-hidden="true">0</span>
  </button>
  <dialog class="kodza-cart-drawer__panel">
    <div class="kodza-cart-drawer__grip" aria-hidden="true"><span></span></div>
    <div class="kodza-cart-drawer__head">
      <h2 class="kodza-cart-drawer__title">Your bag <span class="kodza-cart-drawer__count kodza-cart-drawer__roll">0</span></h2>
      <button class="kodza-cart-drawer__close" type="button" aria-label="Close">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" /></svg>
      </button>
    </div>
    <div class="kodza-cart-drawer__shipping">
      <p class="kodza-cart-drawer__shipping-text"></p>
      <span class="kodza-cart-drawer__meter" aria-hidden="true"><span></span></span>
    </div>
    <div class="kodza-cart-drawer__body">
      <ul class="kodza-cart-drawer__items"></ul>
      <div class="kodza-cart-drawer__empty">
        <p class="kodza-cart-drawer__empty-title">Nothing in here yet.</p>
        <p class="kodza-cart-drawer__empty-text">Your bag is as empty as a roadmap in January. Two things people keep coming back for:</p>
        <div class="kodza-cart-drawer__picks">
          <form class="kodza-cart-drawer__pick" action="/cart/add" method="post" data-title="Dome Lamp" data-price="8900" data-currency="EUR" data-url="#lamp">
            <input type="hidden" name="id" value="dome-lamp-chalk">
            <input type="hidden" name="options[Colour]" value="Chalk">
            <img src="https://kodza.dev/media/shop/kz-shop-lamp-chalk-800.webp" alt="" width="640" height="800" loading="lazy" decoding="async">
            <span class="kodza-cart-drawer__pick-name">Dome Lamp</span>
            <span class="kodza-cart-drawer__pick-price">€89</span>
            <button class="kodza-cart-drawer__pick-add" type="submit">Add <span class="kodza-cart-drawer__sr">Dome Lamp</span></button>
          </form>
          <form class="kodza-cart-drawer__pick" action="/cart/add" method="post" data-title="Drum Pouf" data-price="12900" data-currency="EUR" data-url="#pouf">
            <input type="hidden" name="id" value="drum-pouf-stone">
            <input type="hidden" name="options[Colour]" value="Stone">
            <img src="https://kodza.dev/media/shop/kz-shop-pouf-stone-800.webp" alt="" width="640" height="800" loading="lazy" decoding="async">
            <span class="kodza-cart-drawer__pick-name">Drum Pouf</span>
            <span class="kodza-cart-drawer__pick-price">€129</span>
            <button class="kodza-cart-drawer__pick-add" type="submit">Add <span class="kodza-cart-drawer__sr">Drum Pouf</span></button>
          </form>
        </div>
      </div>
    </div>
    <div class="kodza-cart-drawer__foot">
      <p class="kodza-cart-drawer__total"><span>Subtotal</span> <span class="kodza-cart-drawer__subtotal kodza-cart-drawer__roll">€0.00</span></p>
      <p class="kodza-cart-drawer__note">Taxes and shipping at checkout. No surprise fees, we checked.</p>
      <a class="kodza-cart-drawer__checkout" href="/checkout">Checkout</a>
    </div>
    <p class="kodza-cart-drawer__live" aria-live="polite"></p>
  </dialog>
</div>
