<fieldset class="kodza-rating">
  <legend class="kodza-rating__legend">How was the copy-paste?</legend>
  <div class="kodza-rating__stars">
    <input class="kodza-rating__input" type="radio" name="rating" value="1" aria-label="1 star: Meh">
    <input class="kodza-rating__input" type="radio" name="rating" value="2" aria-label="2 stars: Fine">
    <input class="kodza-rating__input" type="radio" name="rating" value="3" aria-label="3 stars: Good">
    <input class="kodza-rating__input" type="radio" name="rating" value="4" aria-label="4 stars: Great">
    <input class="kodza-rating__input" type="radio" name="rating" value="5" aria-label="5 stars: Shipped it">
  </div>
  <p class="kodza-rating__word" aria-hidden="true"><span>Pick a star</span></p>
</fieldset>

<div class="kodza-rating kodza-rating--static" role="img" aria-label="Rated 4.6 out of 5 by 2,148 developers" style="--kz-score: 4.6">
  <span class="kodza-rating__score">4.6</span>
  <span class="kodza-rating__display" aria-hidden="true"></span>
  <span class="kodza-rating__count">2,148 devs, zero bug reports. Mostly.</span>
</div>
