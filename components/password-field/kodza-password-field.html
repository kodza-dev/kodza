<div class="kodza-password">
  <div class="kodza-password__field">
    <label class="kodza-password__box">
      <input class="kodza-password__input" type="password" name="password" placeholder=" " autocomplete="new-password" minlength="8" required>
      <span class="kodza-password__label">Password</span>
    </label>
    <button class="kodza-password__toggle" type="button" aria-label="Show the password" aria-pressed="false">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M1.8 10S5 4.5 10 4.5 18.2 10 18.2 10 15 15.5 10 15.5 1.8 10 1.8 10Z"/><circle cx="10" cy="10" r="2.6"/><path class="kodza-password__slash" d="M3.5 3.5l13 13" pathLength="1"/></svg>
    </button>
  </div>
  <div class="kodza-password__meter" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  <p class="kodza-password__status"><span class="kodza-password__word">Type something</span></p>
  <ul class="kodza-password__rules">
    <li class="kodza-password__rule" data-rule="length"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" pathLength="1"/></svg>At least 8 characters</li>
    <li class="kodza-password__rule" data-rule="digit"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" pathLength="1"/></svg>A number</li>
    <li class="kodza-password__rule" data-rule="symbol"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" pathLength="1"/></svg>A symbol, like ! or #</li>
  </ul>
</div>
