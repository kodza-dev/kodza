<div class="kodza-gallery" data-kodza-gallery>
  <figure class="kodza-gallery__item" style="--start: 1; --span: 7; --ratio: 3 / 2">
    <button class="kodza-gallery__open" type="button" aria-label="Open image: transition: steps(9)">
      <img class="kodza-gallery__img" src="https://kodza.dev/media/kz-steps-1400.webp" data-full="https://kodza.dev/media/kz-steps-2400.webp" alt="A concrete staircase that climbs nine steps and stops in mid-air" loading="lazy" />
    </button>
    <figcaption class="kodza-gallery__caption">
      <span class="kodza-gallery__index">01</span>
      <span class="kodza-gallery__title">transition: steps(9)</span>
      <span class="kodza-gallery__meta">Leads nowhere</span>
    </figcaption>
  </figure>
  <figure class="kodza-gallery__item" style="--start: 9; --span: 4; --ratio: 4 / 5; --shift: clamp(40px, 8vw, 120px)">
    <button class="kodza-gallery__open" type="button" aria-label="Open image: display: block">
      <img class="kodza-gallery__img" src="https://kodza.dev/media/kz-block-1400.webp" data-full="https://kodza.dev/media/kz-block-2400.webp" alt="A tall concrete slab standing alone, its long shadow stretching toward the viewer" loading="lazy" />
    </button>
    <figcaption class="kodza-gallery__caption">
      <span class="kodza-gallery__index">02</span>
      <span class="kodza-gallery__title">display: block</span>
      <span class="kodza-gallery__meta">Zero dependencies</span>
    </figcaption>
  </figure>
  <figure class="kodza-gallery__item" style="--start: 2; --span: 4; --ratio: 1 / 1">
    <button class="kodza-gallery__open" type="button" aria-label="Open image: border-radius: 50%">
      <img class="kodza-gallery__img" src="https://kodza.dev/media/kz-arch-1400.webp" data-full="https://kodza.dev/media/kz-arch-2400.webp" alt="A concrete wall with a round-topped opening, sunlight pouring through it onto the ground" loading="lazy" />
    </button>
    <figcaption class="kodza-gallery__caption">
      <span class="kodza-gallery__index">03</span>
      <span class="kodza-gallery__title">border-radius: 50%</span>
      <span class="kodza-gallery__meta">Concrete, but soft</span>
    </figcaption>
  </figure>
  <figure class="kodza-gallery__item" style="--start: 7; --span: 5; --ratio: 4 / 3; --shift: clamp(30px, 6vw, 90px)">
    <button class="kodza-gallery__open" type="button" aria-label="Open image: z-index: 9999">
      <img class="kodza-gallery__img" src="https://kodza.dev/media/kz-stack-1400.webp" data-full="https://kodza.dev/media/kz-stack-2400.webp" alt="Three concrete slabs stacked at slightly different angles" loading="lazy" />
    </button>
    <figcaption class="kodza-gallery__caption">
      <span class="kodza-gallery__index">04</span>
      <span class="kodza-gallery__title">z-index: 9999</span>
      <span class="kodza-gallery__meta">Works on my machine</span>
    </figcaption>
  </figure>
  <figure class="kodza-gallery__item" style="--start: 1; --span: 5; --ratio: 4 / 5">
    <button class="kodza-gallery__open" type="button" aria-label="Open image: repeat(7, 1fr)">
      <img class="kodza-gallery__img" src="https://kodza.dev/media/kz-columns-1400.webp" data-full="https://kodza.dev/media/kz-columns-2400.webp" alt="A row of square concrete pillars under a flat roof, casting striped shadows" loading="lazy" />
    </button>
    <figcaption class="kodza-gallery__caption">
      <span class="kodza-gallery__index">05</span>
      <span class="kodza-gallery__title">repeat(7, 1fr)</span>
      <span class="kodza-gallery__meta">Grid, 1968 edition</span>
    </figcaption>
  </figure>
  <figure class="kodza-gallery__item" style="--start: 7; --span: 6; --ratio: 3 / 2; --shift: clamp(40px, 10vw, 150px)">
    <button class="kodza-gallery__open" type="button" aria-label="Open image: position: absolute">
      <img class="kodza-gallery__img" src="https://kodza.dev/media/kz-float-1400.webp" data-full="https://kodza.dev/media/kz-float-2400.webp" alt="A concrete block hovering above the ground, over its own shadow" loading="lazy" />
    </button>
    <figcaption class="kodza-gallery__caption">
      <span class="kodza-gallery__index">06</span>
      <span class="kodza-gallery__title">position: absolute</span>
      <span class="kodza-gallery__meta">Out of the flow</span>
    </figcaption>
  </figure>
</div>
