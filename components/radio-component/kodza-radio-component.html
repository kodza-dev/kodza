<fieldset class="kodza-radio">
  <legend class="kodza-radio__legend">Shipping speed</legend>
  <label class="kodza-radio__item">
    <input class="kodza-radio__input" type="radio" name="speed" value="whenever">
    <span class="kodza-radio__ring" aria-hidden="true"></span>
    <span class="kodza-radio__text">Whenever<small>We will get to it. Probably.</small></span>
  </label>
  <label class="kodza-radio__item">
    <input class="kodza-radio__input" type="radio" name="speed" value="week" checked>
    <span class="kodza-radio__ring" aria-hidden="true"></span>
    <span class="kodza-radio__text">This week<small>Two to three business days.</small></span>
  </label>
  <label class="kodza-radio__item">
    <input class="kodza-radio__input" type="radio" name="speed" value="yesterday">
    <span class="kodza-radio__ring" aria-hidden="true"></span>
    <span class="kodza-radio__text">Yesterday<small>Physically impossible. We tried.</small></span>
  </label>
</fieldset>

<fieldset class="kodza-radio kodza-radio--cards">
  <legend class="kodza-radio__legend">Framework</legend>
  <label class="kodza-radio__item">
    <input class="kodza-radio__input" type="radio" name="framework" value="none" checked>
    <span class="kodza-radio__ring" aria-hidden="true"></span>
    <span class="kodza-radio__text">None<small>Bold choice.</small></span>
  </label>
  <label class="kodza-radio__item">
    <input class="kodza-radio__input" type="radio" name="framework" value="vanilla">
    <span class="kodza-radio__ring" aria-hidden="true"></span>
    <span class="kodza-radio__text">Vanilla<small>Same thing.</small></span>
  </label>
  <label class="kodza-radio__item">
    <input class="kodza-radio__input" type="radio" name="framework" value="plain">
    <span class="kodza-radio__ring" aria-hidden="true"></span>
    <span class="kodza-radio__text">Plain JS<small>Still the same.</small></span>
  </label>
</fieldset>
