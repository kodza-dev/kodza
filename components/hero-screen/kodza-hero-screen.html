<section class="kodza-hero-screen">
  <div class="kodza-hero-screen__scene">
    <div class="kodza-hero-screen__copy">
      <p class="kodza-hero-screen__eyebrow"><span class="kodza-hero-screen__rise">v2.4 is out · shipped on a Tuesday</span></p>
      <h1 class="kodza-hero-screen__title"><span class="kodza-hero-screen__line"><span class="kodza-hero-screen__rise">Show the product.</span></span> <span class="kodza-hero-screen__line"><span class="kodza-hero-screen__rise">Skip the pitch.</span></span></h1>
      <div class="kodza-hero-screen__foot">
        <p class="kodza-hero-screen__lead">Your real screen, not a Dribbble shot. It leans back, then stands up as they scroll.</p>
        <div class="kodza-hero-screen__actions">
          <a class="kodza-hero-screen__button kodza-hero-screen__button--ink" href="#">Try it, no card<svg class="kodza-hero-screen__arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8h10.5M9 3.5 13.5 8 9 12.5" /></svg></a>
          <a class="kodza-hero-screen__button kodza-hero-screen__button--soft" href="#">What's new</a>
        </div>
      </div>
    </div>
    <div class="kodza-hero-screen__stage">
      <div class="kodza-hero-screen__device">
        <div class="kodza-hero-screen__tilt">
          <div class="kodza-hero-screen__shadows" aria-hidden="true"><div class="kodza-hero-screen__shadow kodza-hero-screen__shadow--far"></div><div class="kodza-hero-screen__shadow kodza-hero-screen__shadow--near"></div></div>
          <div class="kodza-hero-screen__curtain">
            <div class="kodza-hero-screen__hold">
              <div class="kodza-hero-screen__frame">
                <div class="kodza-hero-screen__glass"><img src="https://kodza.dev/media/kz-grid-2400.webp" alt="The Kodza catalogue: a search field, category filters and a grid of component previews" width="2400" height="1500" /></div>
                <div class="kodza-hero-screen__veil"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
