<form class="kodza-product-card" action="/cart/add" method="post" data-kodza-cart-add data-title="Low Sofa" data-price="129000" data-currency="EUR" data-url="/products/low-sofa">
  <input type="hidden" name="id" value="low-sofa">
  <div class="kodza-product-card__media">
    <div class="kodza-product-card__track">
      <img class="kodza-product-card__image" src="https://kodza.dev/media/shop/kz-shop-sofa-chalk-800.webp" width="640" height="800" alt="A long, low sofa in chalk-white bouclé" loading="lazy" decoding="async">
      <img class="kodza-product-card__image kodza-product-card__image--second" src="https://kodza.dev/media/shop/kz-shop-sofa-chalk-b-800.webp" width="640" height="800" alt="" loading="lazy" decoding="async">
    </div>
    <span class="kodza-product-card__tag">New</span>
  </div>
  <div class="kodza-product-card__info">
    <h3 class="kodza-product-card__title"><a class="kodza-product-card__link" href="/products/low-sofa">Low Sofa</a></h3>
    <p class="kodza-product-card__price">€1,290</p>
    <fieldset class="kodza-product-card__swatches">
      <legend class="kodza-product-card__hidden">Colour</legend>
      <label class="kodza-product-card__swatch" style="--kz-product-card-swatch: #e9e5dc">
        <input type="radio" name="options[Colour]" value="Chalk" checked data-image="https://kodza.dev/media/shop/kz-shop-sofa-chalk-800.webp" data-image-second="https://kodza.dev/media/shop/kz-shop-sofa-chalk-b-800.webp" data-alt="A long, low sofa in chalk-white bouclé">
        <span class="kodza-product-card__hidden">Chalk</span>
      </label>
      <label class="kodza-product-card__swatch" style="--kz-product-card-swatch: #8f8c86">
        <input type="radio" name="options[Colour]" value="Stone" data-image="https://kodza.dev/media/shop/kz-shop-sofa-stone-800.webp" data-image-second="https://kodza.dev/media/shop/kz-shop-sofa-stone-b-800.webp" data-alt="A long, low sofa in stone-grey bouclé">
        <span class="kodza-product-card__hidden">Stone</span>
      </label>
      <label class="kodza-product-card__swatch" style="--kz-product-card-swatch: #1a1a1a">
        <input type="radio" name="options[Colour]" value="Ink" data-image="https://kodza.dev/media/shop/kz-shop-sofa-ink-800.webp" data-image-second="https://kodza.dev/media/shop/kz-shop-sofa-ink-b-800.webp" data-alt="A long, low sofa in ink-black bouclé">
        <span class="kodza-product-card__hidden">Ink</span>
      </label>
    </fieldset>
  </div>
  <div class="kodza-product-card__add">
    <button class="kodza-product-card__open" type="button" aria-expanded="false"><span class="kodza-product-card__word">Add</span></button>
    <div class="kodza-product-card__sizes" role="group" aria-label="Choose a size">
      <button class="kodza-product-card__size" type="submit" name="options[Size]" value="2 seats">2 seats</button>
      <button class="kodza-product-card__size" type="submit" name="options[Size]" value="3 seats">3 seats</button>
      <button class="kodza-product-card__size" type="submit" name="options[Size]" value="Corner" disabled>Corner<span class="kodza-product-card__hidden">, sold out</span></button>
    </div>
  </div>
</form>
