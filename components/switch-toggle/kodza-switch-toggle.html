<div class="kodza-switch">
  <label class="kodza-switch__row">
    <span class="kodza-switch__text">Dark mode<small>Easier on the eyes at 2 a.m.</small></span>
    <input class="kodza-switch__input" type="checkbox" role="switch" checked>
    <span class="kodza-switch__track" aria-hidden="true"><span class="kodza-switch__thumb"></span></span>
  </label>
  <label class="kodza-switch__row">
    <span class="kodza-switch__text">Email me when it ships<small>One email per release. We promise.</small></span>
    <input class="kodza-switch__input" type="checkbox" role="switch">
    <span class="kodza-switch__track" aria-hidden="true"><span class="kodza-switch__thumb"></span></span>
  </label>
  <label class="kodza-switch__row">
    <span class="kodza-switch__text">Deploy on Fridays<small>Not on our watch.</small></span>
    <input class="kodza-switch__input" type="checkbox" role="switch" disabled>
    <span class="kodza-switch__track" aria-hidden="true"><span class="kodza-switch__thumb"></span></span>
  </label>
</div>

<div class="kodza-switch kodza-switch--labels">
  <label class="kodza-switch__row">
    <span class="kodza-switch__text">Autosave<small>Your work, saved before you think of it.</small></span>
    <input class="kodza-switch__input" type="checkbox" role="switch" checked>
    <span class="kodza-switch__track" aria-hidden="true"><span class="kodza-switch__words"><span>On</span><span>Off</span></span><span class="kodza-switch__thumb"></span></span>
  </label>
</div>

<div class="kodza-switch kodza-switch--inline">
  <label class="kodza-switch__row">
    <span class="kodza-switch__text">No JavaScript<small>12</small></span>
    <input class="kodza-switch__input" type="checkbox" role="switch">
    <span class="kodza-switch__track" aria-hidden="true"><span class="kodza-switch__thumb"></span></span>
  </label>
</div>
