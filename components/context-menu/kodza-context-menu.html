<div class="kodza-context-menu">
  <div class="kodza-context-menu__area" tabindex="0" aria-label="Right-click area. Press Shift and F10 to open the menu.">
    <p class="kodza-context-menu__title">Right-click anywhere in here.</p>
    <p class="kodza-context-menu__hint">or Shift + F10</p>
  </div>
  <div class="kodza-context-menu__menu" role="menu" aria-label="Actions">
    <button class="kodza-context-menu__item" type="button" role="menuitem">Copy <kbd class="kodza-context-menu__hint">⌘C</kbd></button>
    <button class="kodza-context-menu__item" type="button" role="menuitem">Paste <kbd class="kodza-context-menu__hint">⌘V</kbd></button>
    <button class="kodza-context-menu__item" type="button" role="menuitem">Rename</button>
    <div class="kodza-context-menu__separator" role="separator"></div>
    <button class="kodza-context-menu__item" type="button" role="menuitem" aria-disabled="true">Undo the last three hours</button>
    <button class="kodza-context-menu__item" type="button" role="menuitem">Move to trash <kbd class="kodza-context-menu__hint">⌫</kbd></button>
  </div>
</div>
