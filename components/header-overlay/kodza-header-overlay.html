<header class="kodza-header-overlay">
  <div class="kodza-header-overlay__bar">
    <span class="kodza-header-overlay__veil" aria-hidden="true"></span>
    <span class="kodza-header-overlay__blind" aria-hidden="true"><span class="kodza-header-overlay__fill"></span></span>
    <div class="kodza-header-overlay__row">
      <a class="kodza-header-overlay__logo" href="#" aria-label="Quayside, home"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill-rule="evenodd" d="M2 23V12a10 10 0 0 1 20 0v11zM7.5 23v-10a4.5 4.5 0 0 1 9 0v10z"/></svg><span>Quayside</span></a>
      <nav class="kodza-header-overlay__menu" aria-label="Main">
        <ul class="kodza-header-overlay__links">
          <li><a class="kodza-header-overlay__item" href="#">Rooms</a></li>
          <li><a class="kodza-header-overlay__item" href="#">Dining</a></li>
          <li><a class="kodza-header-overlay__item" href="#">The House</a></li>
          <li><a class="kodza-header-overlay__item" href="#">Journal</a></li>
        </ul>
      </nav>
      <div class="kodza-header-overlay__end">
        <a class="kodza-header-overlay__cta" href="#">Book a room</a>
        <button class="kodza-header-overlay__toggle" type="button" aria-haspopup="dialog" aria-expanded="false"><span class="kodza-header-overlay__lines" aria-hidden="true"></span>Menu</button>
      </div>
    </div>
  </div>
  <div class="kodza-header-overlay__panel" role="dialog" aria-modal="true" aria-label="Menu" tabindex="-1" hidden>
    <span class="kodza-header-overlay__shade" aria-hidden="true"></span>
    <span class="kodza-header-overlay__curtain" aria-hidden="true"><svg class="kodza-header-overlay__edge" viewBox="0 0 100 100" preserveAspectRatio="none" focusable="false"><path d="M0 0Q50 200 100 0Z"/></svg></span>
    <div class="kodza-header-overlay__body">
      <div class="kodza-header-overlay__head">
        <p class="kodza-header-overlay__label">Twelve rooms on the quay.</p>
        <button class="kodza-header-overlay__close" type="button"><span class="kodza-header-overlay__cross" aria-hidden="true"></span><span class="kodza-header-overlay__say"><span>Close</span></span></button>
      </div>
      <div class="kodza-header-overlay__stage">
        <nav class="kodza-header-overlay__nav" aria-label="Main"></nav>
        <div class="kodza-header-overlay__info">
          <div class="kodza-header-overlay__group">
            <p class="kodza-header-overlay__small">Book a room</p>
            <p><a href="#">stay@example.com</a></p>
          </div>
          <div class="kodza-header-overlay__group">
            <p class="kodza-header-overlay__small">The house</p>
            <p><span class="kodza-header-overlay__line">Quai de Southampton</span><span class="kodza-header-overlay__line">Le Havre</span></p>
          </div>
          <div class="kodza-header-overlay__group">
            <p class="kodza-header-overlay__small">Elsewhere</p>
            <p class="kodza-header-overlay__socials"><a href="#">Instagram</a><a href="#">Maps</a></p>
          </div>
          <p class="kodza-header-overlay__small">Esc closes it. So does Close.</p>
        </div>
      </div>
    </div>
  </div>
</header>
