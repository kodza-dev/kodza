<div class="kodza-number-stepper">
  <label class="kodza-number-stepper__box">
    <span class="kodza-number-stepper__label">Guests</span>
    <input class="kodza-number-stepper__input" type="number" name="guests" value="2" min="1" max="12" step="1" inputmode="numeric">
  </label>
  <p class="kodza-number-stepper__note">
    <span class="kodza-number-stepper__hint">Up to 12. The sofa folds out.</span>
    <span class="kodza-number-stepper__error" aria-live="polite"></span>
  </p>
</div>

<div class="kodza-number-stepper kodza-number-stepper--compact">
  <label class="kodza-number-stepper__box">
    <span class="kodza-number-stepper__label">Quantity</span>
    <input class="kodza-number-stepper__input" type="number" name="quantity" value="1" min="1" max="5" step="1" inputmode="numeric">
  </label>
  <p class="kodza-number-stepper__note">
    <span class="kodza-number-stepper__hint">5 left.</span>
    <span class="kodza-number-stepper__error" aria-live="polite"></span>
  </p>
</div>
