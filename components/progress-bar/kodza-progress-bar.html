<div class="kodza-progress" role="progressbar" aria-label="Uploading hero.webp" data-value="0" data-done="hero.webp is live">
  <div class="kodza-progress__head">
    <span class="kodza-progress__label">Uploading hero.webp</span>
    <span class="kodza-progress__value">0%</span>
  </div>
  <div class="kodza-progress__track"><span class="kodza-progress__fill"></span></div>
</div>

<div class="kodza-progress" role="progressbar" aria-label="Waiting for a CI runner">
  <div class="kodza-progress__head">
    <span class="kodza-progress__label">Waiting for a CI runner</span>
    <span class="kodza-progress__value"></span>
  </div>
  <div class="kodza-progress__track"><span class="kodza-progress__fill"></span></div>
</div>

<div class="kodza-progress kodza-progress--ring" role="progressbar" aria-label="Tests passing" data-value="0" data-done="All green">
  <div class="kodza-progress__dial">
    <svg class="kodza-progress__ring" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21" /><circle cx="24" cy="24" r="21" pathLength="100" /></svg>
    <span class="kodza-progress__value">0%</span>
  </div>
  <span class="kodza-progress__label">Tests passing</span>
</div>
