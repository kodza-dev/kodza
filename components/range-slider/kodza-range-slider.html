<div class="kodza-range" data-prefix="€">
  <div class="kodza-range__head">
    <span class="kodza-range__label">Budget</span>
    <output class="kodza-range__output"></output>
  </div>
  <div class="kodza-range__track">
    <input class="kodza-range__input" type="range" min="0" max="500" step="10" value="120" aria-label="Minimum budget">
    <input class="kodza-range__input" type="range" min="0" max="500" step="10" value="380" aria-label="Maximum budget">
  </div>
  <div class="kodza-range__scale" aria-hidden="true"><span>€0</span><span>€250</span><span>€500</span></div>
</div>

<div class="kodza-range" data-ticks>
  <div class="kodza-range__head">
    <span class="kodza-range__label">Volume<small>These go to eleven.</small></span>
    <output class="kodza-range__output"></output>
  </div>
  <div class="kodza-range__track">
    <input class="kodza-range__input" type="range" min="0" max="11" step="1" value="7" aria-label="Volume">
  </div>
</div>
